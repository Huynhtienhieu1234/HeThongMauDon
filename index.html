<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AUTO WORD GENERATOR v1.0</title>
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
  <!-- Thư viện xử lý DOCX & Preview phía client (tương thích GitHub Pages) -->
  <script src="https://unpkg.com/pizzip@3.1.7/dist/pizzip.min.js"></script>
  <script src="https://unpkg.com/docxtemplater@3.50.0/build/docxtemplater.js"></script>
  <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://unpkg.com/docx-preview@0.3.3/dist/docx-preview.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-icon">W</div>
          <div class="brand-text">
            <h1 id="appBrandName">AUTO WORD</h1>
            <span>Generator v1.0</span>
          </div>
        </div>
        <button class="btn-icon mobile-close" id="sidebarCloseBtn" title="Đóng menu">✕</button>
      </div>

      <nav class="sidebar-nav" id="sidebarNav">
        <button class="nav-item active" data-view="dashboard">
          <span class="nav-icon">📊</span>
          <span>Tổng quan</span>
        </button>
        <button class="nav-item" data-view="library">
          <span class="nav-icon">📁</span>
          <span>Thư viện mẫu</span>
        </button>
        <button class="nav-item" data-view="setup">
          <span class="nav-icon">⚙️</span>
          <span>Thiết lập mẫu</span>
        </button>
        <button class="nav-item" data-view="generator">
          <span class="nav-icon">📝</span>
          <span>Tạo văn bản</span>
        </button>
        <button class="nav-item" data-view="preview">
          <span class="nav-icon">👁️</span>
          <span>Xem trước</span>
        </button>
        <button class="nav-item" data-view="history">
          <span class="nav-icon">🕘</span>
          <span>Lịch sử</span>
        </button>
        <button class="nav-item" data-view="students">
          <span class="nav-icon">👨‍🎓</span>
          <span>Dữ liệu sinh viên</span>
        </button>
        <button class="nav-item" data-view="backup">
          <span class="nav-icon">💾</span>
          <span>Sao lưu &amp; Khôi phục</span>
        </button>
        <button class="nav-item" data-view="settings">
          <span class="nav-icon">🛠️</span>
          <span>Cài đặt</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <a class="btn btn-primary btn-sm" href="student.html" target="_blank" style="width:100%;margin-bottom:10px;">🎓 Mở Cổng Sinh viên</a>
        <div class="local-notice">
          <strong>🔒 Lưu trữ cục bộ</strong>
          <p>Dữ liệu lưu trên trình duyệt &amp; thiết bị này (IndexedDB). Không gửi lên máy chủ.</p>
        </div>
      </div>
    </aside>

    <!-- Backdrop for mobile -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- Main area -->
    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn-icon mobile-menu-btn" id="mobileMenuBtn" title="Mở menu">☰</button>
          <h2 class="page-title" id="pageTitle">Tổng quan</h2>
        </div>
        <div class="topbar-right">
          <div class="quick-search">
            <input type="search" id="globalSearchInput" placeholder="Tìm nhanh mẫu văn bản..." />
          </div>
          <button class="btn btn-primary btn-sm" id="quickCreateBtn">+ Tạo văn bản</button>
        </div>
      </header>

      <main class="main-content" id="mainContent">
        <div class="loading-state">Đang khởi tạo ứng dụng...</div>
      </main>

      <footer class="app-footer">
        AUTO WORD GENERATOR v1.0 • Người tạo: <strong>KS.Huỳnh Tiến Hiểu</strong>
      </footer>
    </div>
  </div>

  <!-- Modal Container -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal-box" id="modalBox">
      <div class="modal-header">
        <h3 id="modalTitle">Tiêu đề</h3>
        <button class="btn-icon" id="modalCloseBtn">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
